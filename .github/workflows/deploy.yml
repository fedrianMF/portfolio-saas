name: Deploy SaaS to Production

on:
  push:
    branches: [prod] # Cambiado de main a prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Crear la carpeta si no existe
            mkdir -p ~/projects/saas
            cd ~/projects/saas

            # Si no es un repositorio git, clonarlo. Si existe, actualizarlo.
            if [ ! -d ".git" ]; then
              git clone -b prod https://github.com/fedrianMF/portfolio-saas.git .
            else
              git fetch origin prod
              git reset --hard origin/prod
            fi

            # Levantar Docker
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
